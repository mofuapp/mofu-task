<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8887A">
<title>mofu todo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#3B2E5A;--pink:#E8887A;--pink-light:#F5C4BC;--pink-bg:#FFF5F3;
  --carry:#C4A56B;--carry-bg:#FBF5EA;
  --text:#3B2E5A;--text-sub:#9B9BB3;--bg:#FAFAFA;--card:#fff;
  --tab-todo:#B8C5A5;--tab-routine:#E8B4B8;--tab-event:#A8C5C8;--tab-checklist:#E5D9B1;--tab-settings:#C8C8D4;
  --radius:20px;--tab-w:34px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.app{display:flex;height:100%;padding-top:var(--safe-top)}

/* ===== INDEX TABS ===== */
.index-tabs{width:var(--tab-w);flex-shrink:0;display:flex;flex-direction:column;padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));z-index:10}
.index-tab{width:100%;flex-shrink:0;border-radius:0 12px 12px 0;padding:14px 4px;font-size:11px;font-weight:700;color:var(--purple);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.05em;transition:.2s;margin-bottom:4px}
.index-tab[data-tab="todo"]{background:var(--tab-todo)}
.index-tab[data-tab="routine"]{background:var(--tab-routine)}
.index-tab[data-tab="event"]{background:var(--tab-event)}
.index-tab[data-tab="checklist"]{background:var(--tab-checklist)}
.index-tab[data-tab="settings"]{background:var(--tab-settings);margin-top:auto;margin-bottom:0}
.index-tab.active{background:#fff;color:var(--purple);box-shadow:2px 0 8px rgba(0,0,0,.04)}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;border-radius:24px 0 0 24px;overflow:hidden;position:relative}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.screen.active{display:flex}

/* ===== TODO ===== */
.todo-header{padding:20px 20px 0;flex-shrink:0}
.todo-top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.todo-month{font-size:13px;color:var(--text-sub);font-weight:600}
.todo-icons{display:flex;gap:14px;color:var(--purple)}
.todo-icons button{padding:4px;color:var(--purple);opacity:.7}
.todo-date-row{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.todo-date{font-size:42px;font-weight:800;line-height:1;color:var(--purple)}
.todo-weekday{font-size:42px;font-weight:800;color:var(--purple)}
.todo-badge{font-size:10px;font-weight:800;color:#5B8FA8;background:#E8F4F8;padding:3px 8px;border-radius:6px;align-self:center}
.todo-divider{height:2px;background:var(--purple);opacity:.15;margin:0 20px}

.todo-body{flex:1;overflow-y:auto;padding:16px 20px 120px;-webkit-overflow-scrolling:touch}
.carry-label{font-size:12px;font-weight:700;color:var(--carry);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.carry-label::after{content:'';flex:1;height:1px;background:var(--carry);opacity:.3}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5}
.task-item.carry .task-text{color:var(--carry)}
.task-check{width:22px;height:22px;border:2px solid var(--purple);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-check.done{background:var(--purple);border-color:var(--purple)}
.task-check.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.task-info{flex:1;min-width:0}
.task-text{font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
.task-text.done{text-decoration:line-through;color:var(--text-sub);font-weight:500}
.carry-from{font-size:11px;color:var(--carry);margin-top:2px;font-weight:600}
.task-add-wrap{background:#F0F0F0;border-radius:var(--radius);padding:14px 16px;margin-top:8px}
.task-add-wrap input{width:100%;border:none;background:transparent;font-size:15px;color:var(--purple);outline:none}
.task-add-wrap input::placeholder{color:var(--text-sub)}
.scan-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 14px;border:1.5px solid var(--pink-light);border-radius:20px;font-size:12px;font-weight:600;color:var(--purple);background:#fff}
.todo-empty{text-align:center;padding:48px 20px;color:var(--text-sub);font-size:14px}
.restore-link{display:block;text-align:right;font-size:12px;color:var(--text-sub);margin-top:12px;padding:4px 0}

.todo-footer{position:absolute;bottom:0;left:0;right:0;padding:12px 20px calc(12px + var(--safe-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,#fff 30%)}
.toggle-pill{width:52px;height:28px;border-radius:14px;background:var(--purple);position:relative;transition:.2s}
.toggle-pill.off{background:#ddd}
.toggle-pill::after{content:'−';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--purple);transition:.2s;line-height:22px;text-align:center}
.toggle-pill.off::after{content:'+';left:27px;color:#999}
.day-dots{display:flex;align-items:center;gap:6px}
.day-dot{width:6px;height:6px;border-radius:50%;background:#ddd}
.day-dot.active{background:var(--purple);width:8px;height:8px}
.day-nav-btn{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;margin-left:8px}

/* ===== ROUTINE / EVENT HEADERS ===== */
.page-header{padding:24px 20px 0;flex-shrink:0}
.page-title{font-size:32px;font-weight:800;color:var(--purple);margin-bottom:12px}
.page-divider{height:2px;background:var(--purple);opacity:.15;margin:0 20px}
.page-body{flex:1;overflow-y:auto;padding:20px 20px 100px;-webkit-overflow-scrolling:touch}

.routine-q{font-size:16px;font-weight:700;margin-bottom:4px}
.routine-sub{font-size:13px;color:var(--text-sub);margin-bottom:24px}
.routine-section{font-size:14px;font-weight:700;margin-bottom:12px}
.routine-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0}
.routine-icon{font-size:22px;width:28px;text-align:center}
.routine-name{flex:1;font-size:15px;font-weight:600}
.routine-pick{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.routine-pick.on{background:var(--purple);border-color:var(--purple)}
.routine-pick.on::after{content:'✓'}
.save-btn{display:block;width:100%;max-width:280px;margin:28px auto 0;padding:14px;border-radius:28px;background:var(--purple);color:#fff;font-size:15px;font-weight:700;text-align:center}
.save-btn:active{opacity:.85}

.event-q{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:8px}
.event-sub{font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:28px}
.event-icons{display:flex;justify-content:center;gap:20px;margin-bottom:32px}
.event-icon-btn{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.event-icon-btn[data-type="birthday"]{background:#D4E8F0}
.event-icon-btn[data-type="party"]{background:#F0D4D4}
.event-icon-btn[data-type="home"]{background:#D4E8E0}
.event-list{margin-top:8px}
.event-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.event-item-icon{font-size:24px}
.event-item-info{flex:1}
.event-item-title{font-size:15px;font-weight:600}
.event-item-date{font-size:12px;color:var(--text-sub);margin-top:2px}
.year-nav{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--purple)}
.year-nav button{width:32px;height:32px;border-radius:50%;background:var(--pink-bg);color:var(--purple);font-size:18px;display:flex;align-items:center;justify-content:center}

/* ===== CHECKLIST ===== */
.cl-toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0}
.cl-list-btn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--purple);padding:6px 10px;border-radius:8px;background:var(--pink-bg)}
.cl-sort{font-size:13px;color:var(--text-sub);padding:6px}
.cl-header{padding:8px 20px 0;display:flex;align-items:center;justify-content:space-between}
.cl-title{font-size:22px;font-weight:800;color:var(--purple)}
.cl-actions{display:flex;gap:12px;color:var(--purple);opacity:.6}
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f5f5f5}
.cl-check{width:22px;height:22px;border:2px solid var(--purple);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.cl-check.done{background:var(--purple);border-color:var(--purple)}
.cl-check.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.cl-text{flex:1;font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
.cl-text.done{text-decoration:line-through;color:var(--text-sub)}
.cl-add-wrap{background:#F0F0F0;border-radius:var(--radius);padding:14px 16px;margin-top:8px}

/* ===== SETTINGS ===== */
.settings-group{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.settings-item{width:100%;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;text-align:left;font-size:15px;font-weight:600;color:var(--text)}
.settings-item:last-child{border:none}
.settings-item.danger{color:#E85050}
.settings-item span{color:var(--text-sub);font-weight:400}

/* ===== FAB ===== */
.fab{position:absolute;bottom:calc(20px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--purple);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(59,46,90,.35);z-index:20;transition:.2s}
.fab:active{transform:scale(.92)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:20px 20px calc(20px + var(--safe-bottom));overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 16px}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px;color:var(--purple)}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:4px;font-weight:600}
.modal-field input,.modal-field select{width:100%;padding:12px 14px;border:1.5px solid #e8e8e8;border-radius:12px;font-size:15px;outline:none;background:#fff}
.modal-field input:focus{border-color:var(--pink)}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-btn{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700}
.modal-btn.primary{background:var(--purple);color:#fff}
.modal-btn.secondary{background:var(--pink-bg);color:var(--purple)}
.modal-btn.danger{background:#FFF0F0;color:#E85050}
.choice-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.choice-btn{padding:10px 16px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:14px;font-weight:600;color:var(--purple)}
.choice-btn.selected{background:var(--purple);color:#fff;border-color:var(--purple)}
</style>
</head>
<body>
<div class="app">
  <nav class="index-tabs" id="index-tabs"></nav>
  <main class="main">
    <div class="screen active" id="screen-todo"></div>
    <div class="screen" id="screen-routine"></div>
    <div class="screen" id="screen-event"></div>
    <div class="screen" id="screen-checklist"></div>
    <div class="screen" id="screen-settings"></div>
    <button type="button" class="fab" id="fab" aria-label="追加">+</button>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const STORAGE_KEY = 'mofu_index_v1';
const DAY_NAMES = ['日','月','火','水','木','金','土'];
const PRESET_ROUTINES = [
  { id:'bed', icon:'🌅', text:'ベッドを整える' },
  { id:'stretch', icon:'🧘', text:'1分ストレッチ' },
  { id:'water', icon:'💧', text:'水を飲む' },
  { id:'read', icon:'📖', text:'5分読書' },
  { id:'walk', icon:'🚶', text:'散歩' }
];
const EVENT_TYPES = [
  { type:'birthday', icon:'🎂', label:'誕生日' },
  { type:'party', icon:'🎉', label:'記念日' },
  { type:'home', icon:'🏠', label:'その他' }
];

let state = {
  screen: 'todo',
  selectedDate: '',
  hideDone: false,
  dayOffset: 0,
  tasks: [],
  deletedTasks: [],
  lists: [],
  selectedListId: '',
  routines: [],
  routineDraft: {},
  events: [],
  eventYear: new Date().getFullYear(),
  modal: null
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  migrate();
  if (!state.selectedDate) state.selectedDate = todayStr();
  if (!state.lists.length) {
    state.lists = [{ id: uid(), name:'買い出しリスト', emoji:'🛒', items:[] }];
    state.selectedListId = state.lists[0].id;
  }
  if (!state.selectedListId) state.selectedListId = state.lists[0].id;
  PRESET_ROUTINES.forEach(r => {
    if (state.routineDraft[r.id] === undefined) {
      state.routineDraft[r.id] = state.routines.some(x => x.presetId === r.id);
    }
  });
}

function save() {
  const { modal, ...data } = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function migrate() {
  let changed = false;
  if (!Array.isArray(state.tasks)) { state.tasks = []; changed = true; }
  if (!Array.isArray(state.deletedTasks)) { state.deletedTasks = []; changed = true; }
  if (!Array.isArray(state.lists)) { state.lists = []; changed = true; }
  if (!Array.isArray(state.routines)) { state.routines = []; changed = true; }
  if (!Array.isArray(state.events)) { state.events = []; changed = true; }
  if (!state.routineDraft) { state.routineDraft = {}; changed = true; }

  const legacy = localStorage.getItem('mofu_tasks');
  if (legacy && !state.tasks.length) {
    try {
      const old = JSON.parse(legacy);
      if (Array.isArray(old)) {
        old.forEach(t => {
          if (t.type === 'task' && t.name) {
            state.tasks.push({
              id: t.id || uid(),
              text: t.name,
              date: t.date || todayStr(),
              done: !!t.done,
              doneAt: t.doneAt || null
            });
          } else if (t.type === 'event' && t.name && t.date) {
            state.events.push({
              id: t.id || uid(),
              title: t.name,
              date: t.date,
              icon: '📅',
              eventType: 'home'
            });
          }
        });
        changed = true;
      }
    } catch (e) {}
  }

  state.tasks.forEach(t => {
    if (t.text === undefined && t.name) { t.text = t.name; delete t.name; changed = true; }
  });
  if (changed) save();
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr() { return dateStr(new Date()); }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysStr(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function esc(s) { const el = document.createElement('div'); el.textContent = s; return el.innerHTML; }

function switchScreen(name) {
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.index-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('fab').style.display = (name === 'settings') ? 'none' : 'flex';
  render();
}

function render() {
  renderIndexTabs();
  if (state.screen === 'todo') renderTodo();
  else if (state.screen === 'routine') renderRoutine();
  else if (state.screen === 'event') renderEvent();
  else if (state.screen === 'checklist') renderChecklist();
  else if (state.screen === 'settings') renderSettings();
}

function renderIndexTabs() {
  const tabs = [
    { id:'todo', label:'Todo' },
    { id:'routine', label:'Routine' },
    { id:'event', label:'Event' },
    { id:'checklist', label:'Checklist' },
    { id:'settings', label:'Settings' }
  ];
  document.getElementById('index-tabs').innerHTML = tabs.map(t =>
    `<button type="button" class="index-tab${state.screen===t.id?' active':''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('.index-tab').forEach(btn => {
    btn.addEventListener('click', () => switchScreen(btn.dataset.tab));
  });
}

/* ===== TODO ===== */
function getViewDate() {
  return addDaysStr(todayStr(), state.dayOffset);
}

function renderTodo() {
  const ds = getViewDate();
  state.selectedDate = ds;
  const d = parseDate(ds);
  const today = todayStr();
  const isToday = ds === today;

  const dayEvents = getEventsForDate(ds);
  const carryover = state.tasks.filter(t => !t.done && t.date && t.date < ds);
  const todayTasks = state.tasks.filter(t => !t.done && t.date === ds);
  let doneTasks = state.tasks.filter(t => t.done && (t.date === ds || (t.doneAt && t.doneAt.startsWith(ds))));
  if (state.hideDone) doneTasks = [];

  const el = document.getElementById('screen-todo');
  let html = `
    <div class="todo-header">
      <div class="todo-top-row">
        <div class="todo-month">${d.getMonth()+1}月.${d.getFullYear()}</div>
        <div class="todo-icons">
          <button type="button" aria-label="履歴" title="履歴">🕐</button>
          <button type="button" aria-label="目標" title="目標">🎯</button>
          <button type="button" aria-label="統計" title="統計">📊</button>
        </div>
      </div>
      <div class="todo-date-row">
        <span class="todo-date">${d.getDate()}.</span>
        <span class="todo-weekday">${DAY_NAMES[d.getDay()]}</span>
        ${isToday ? '<span class="todo-badge">TODAY</span>' : ''}
      </div>
    </div>
    <div class="todo-divider"></div>
    <div class="todo-body" id="todo-body">`;

  if (!dayEvents.length && !carryover.length && !todayTasks.length && !doneTasks.length) {
    html += `<div class="todo-empty">${isToday ? '今日のタスクはありません' : 'この日のタスクはありません'}</div>`;
  }

  if (dayEvents.length) {
    html += '<div class="carry-label" style="color:var(--purple)">イベント</div>';
    dayEvents.forEach(ev => {
      html += `<div class="task-item"><span style="font-size:20px">${ev.icon||'📅'}</span><div class="task-info"><div class="task-text">${esc(ev.title)}</div></div></div>`;
    });
  }
  if (carryover.length) {
    html += '<div class="carry-label">繰り越し</div>';
    carryover.forEach(t => { html += taskRowHtml(t, true); });
  }
  todayTasks.forEach(t => { html += taskRowHtml(t, false); });
  doneTasks.forEach(t => { html += taskRowHtml(t, false, true); });

  html += `
      <div class="task-add-wrap">
        <input type="text" id="todo-input" placeholder="やること追加" autocomplete="off">
      </div>
      <button type="button" class="scan-btn">🔒 紙のToDoスキャン</button>
      ${state.deletedTasks.length ? `<button type="button" class="restore-link" id="btn-restore">削除されたタスクを復元 (${state.deletedTasks.length})</button>` : ''}
    </div>
    <div class="todo-footer">
      <button type="button" class="toggle-pill${state.hideDone?' off':''}" id="toggle-done" aria-label="完了を表示"></button>
      <div class="day-dots" id="day-dots"></div>
      <button type="button" class="day-nav-btn" id="btn-goto-today" title="今日へ">→</button>
    </div>`;

  el.innerHTML = html;

  const dotsEl = document.getElementById('day-dots');
  for (let i = -3; i <= 3; i++) {
    dotsEl.innerHTML += `<span class="day-dot${i===state.dayOffset?' active':''}"></span>`;
  }

  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodoTask(e.target.value.trim());
  });
  document.getElementById('toggle-done').addEventListener('click', () => {
    state.hideDone = !state.hideDone;
    save();
    renderTodo();
  });
  document.getElementById('btn-goto-today').addEventListener('click', () => {
    state.dayOffset = 0;
    save();
    renderTodo();
  });
  dotsEl.querySelectorAll('.day-dot').forEach((dot, i) => {
    dot.addEventListener('click', () => {
      state.dayOffset = i - 3;
      save();
      renderTodo();
    });
  });
  if (state.deletedTasks.length) {
    document.getElementById('btn-restore').addEventListener('click', openRestoreModal);
  }
  bindTaskChecks(el);
}

function taskRowHtml(t, isCarry, forceDone) {
  const done = forceDone || t.done;
  const fromLabel = isCarry && t.date ? `${parseInt(t.date.slice(5,7))}/${parseInt(t.date.slice(8))}から` : '';
  return `
    <div class="task-item${isCarry?' carry':''}" data-id="${esc(t.id)}">
      <button type="button" class="task-check${done?' done':''}" data-action="toggle" data-id="${esc(t.id)}" aria-label="完了切替"></button>
      <div class="task-info">
        <div class="task-text${done?' done':''}">${esc(t.text)}</div>
        ${fromLabel ? `<div class="carry-from">${fromLabel}</div>` : ''}
      </div>
    </div>`;
}

function bindTaskChecks(root) {
  root.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => toggleTask(btn.dataset.id));
  });
}

function addTodoTask(text) {
  if (!text) return;
  state.tasks.push({ id: uid(), text, date: getViewDate(), done: false, doneAt: null });
  save();
  renderTodo();
  const inp = document.getElementById('todo-input');
  if (inp) { inp.value = ''; inp.focus(); }
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? todayStr() : null;
  save();
  renderTodo();
}

function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  state.deletedTasks.unshift({ ...t, deletedAt: todayStr() });
  state.tasks = state.tasks.filter(x => x.id !== id);
  save();
  closeModal();
  renderTodo();
}

/* ===== ROUTINE ===== */
function renderRoutine() {
  const el = document.getElementById('screen-routine');
  let rows = PRESET_ROUTINES.map(r => {
    const on = !!state.routineDraft[r.id];
    return `
      <div class="routine-row">
        <span class="routine-icon">${r.icon}</span>
        <span class="routine-name">${esc(r.text)}</span>
        <button type="button" class="routine-pick${on?' on':''}" data-preset="${r.id}" aria-label="選択"></button>
      </div>`;
  }).join('');

  if (state.routines.filter(r => !r.presetId).length) {
    rows += state.routines.filter(r => !r.presetId).map(r => `
      <div class="routine-row">
        <span class="routine-icon">✨</span>
        <span class="routine-name">${esc(r.text)}</span>
        <button type="button" class="routine-pick on" aria-label="登録済"></button>
      </div>`).join('');
  }

  el.innerHTML = `
    <div class="page-header"><div class="page-title">Routine</div></div>
    <div class="page-divider"></div>
    <div class="page-body">
      <div class="routine-q">あなたの1週間のルーティンは何ですか？</div>
      <div class="routine-sub">読書、瞑想、料理...？</div>
      <div class="routine-section">おすすめのルーティン</div>
      ${rows}
      <button type="button" class="save-btn" id="btn-save-routine">選択したルーティンを保存</button>
    </div>`;

  el.querySelectorAll('.routine-pick[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.preset;
      state.routineDraft[id] = !state.routineDraft[id];
      save();
      renderRoutine();
    });
  });
  document.getElementById('btn-save-routine').addEventListener('click', saveRoutines);
}

function saveRoutines() {
  const custom = state.routines.filter(r => !r.presetId);
  state.routines = PRESET_ROUTINES.filter(r => state.routineDraft[r.id]).map(r => ({
    id: uid(), presetId: r.id, text: r.text, icon: r.icon
  }));
  state.routines.push(...custom);
  save();
  alert('ルーティンを保存しました');
}

/* ===== EVENT ===== */
function renderEvent() {
  const el = document.getElementById('screen-event');
  const yearEvents = state.events.filter(e => e.date && e.date.startsWith(String(state.eventYear)));

  el.innerHTML = `
    <div class="page-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="page-title">Event</div>
        <div class="year-nav">
          <button type="button" id="ev-prev">←</button>
          <span>${state.eventYear}</span>
          <button type="button" id="ev-next">→</button>
        </div>
      </div>
    </div>
    <div class="page-divider"></div>
    <div class="page-body">
      <div class="event-q">もうすぐ誕生日や記念日などの予定はありますか？</div>
      <div class="event-sub">追加したイベントは、その日の Todo リストの上部に表示されます。</div>
      <div class="event-icons">
        ${EVENT_TYPES.map(t => `<button type="button" class="event-icon-btn" data-type="${t.type}" aria-label="${t.label}">${t.icon}</button>`).join('')}
      </div>
      <div class="event-list" id="event-list">
        ${yearEvents.length ? yearEvents.map(ev => eventRowHtml(ev)).join('') : '<div class="todo-empty">イベントはまだありません</div>'}
      </div>
    </div>`;

  document.getElementById('ev-prev').addEventListener('click', () => { state.eventYear--; save(); renderEvent(); });
  document.getElementById('ev-next').addEventListener('click', () => { state.eventYear++; save(); renderEvent(); });
  el.querySelectorAll('.event-icon-btn').forEach(btn => {
    btn.addEventListener('click', () => openEventModal(btn.dataset.type));
  });
  el.querySelectorAll('[data-action="del-event"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.events = state.events.filter(e => e.id !== btn.dataset.id);
      save();
      renderEvent();
    });
  });
}

function eventRowHtml(ev) {
  const d = parseDate(ev.date);
  return `
    <div class="event-item">
      <span class="event-item-icon">${ev.icon || '📅'}</span>
      <div class="event-item-info">
        <div class="event-item-title">${esc(ev.title)}</div>
        <div class="event-item-date">${d.getMonth()+1}月${d.getDate()}日</div>
      </div>
      <button type="button" data-action="del-event" data-id="${esc(ev.id)}" style="color:var(--text-sub);font-size:12px">削除</button>
    </div>`;
}

function getEventsForDate(ds) {
  return state.events.filter(e => e.date === ds);
}

/* ===== CHECKLIST ===== */
function renderChecklist() {
  const list = state.lists.find(l => l.id === state.selectedListId) || state.lists[0];
  if (!list) return;
  state.selectedListId = list.id;

  const pending = list.items.filter(i => !i.done);
  const done = list.items.filter(i => i.done);

  const el = document.getElementById('screen-checklist');
  el.innerHTML = `
    <div class="cl-toolbar">
      <button type="button" class="cl-list-btn" id="btn-list-picker">${esc(list.emoji)} List ▾</button>
      <button type="button" class="cl-sort" id="btn-sort">並べ替え</button>
    </div>
    <div class="cl-header">
      <div class="cl-title">${esc(list.emoji)} ${esc(list.name)}</div>
      <div class="cl-actions">
        <button type="button" id="btn-edit-list" aria-label="編集">✏️</button>
      </div>
    </div>
    <div class="page-divider"></div>
    <div class="page-body">
      ${[...pending, ...done].map(item => `
        <div class="cl-item" data-id="${esc(item.id)}">
          <button type="button" class="cl-check${item.done?' done':''}" data-action="cl-toggle" data-id="${esc(item.id)}"></button>
          <span class="cl-text${item.done?' done':''}">${esc(item.text)}</span>
        </div>`).join('')}
      <div class="cl-add-wrap">
        <input type="text" id="cl-input" placeholder="項目を追加" autocomplete="off">
      </div>
    </div>`;

  document.getElementById('cl-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addChecklistItem(e.target.value.trim());
  });
  el.querySelectorAll('[data-action="cl-toggle"]').forEach(btn => {
    btn.addEventListener('click', () => toggleChecklistItem(btn.dataset.id));
  });
  document.getElementById('btn-list-picker').addEventListener('click', openListPickerModal);
  document.getElementById('btn-edit-list').addEventListener('click', () => openListEditModal(list.id));
  document.getElementById('btn-sort').addEventListener('click', () => {
    list.items.sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));
    save();
    renderChecklist();
  });
}

function addChecklistItem(text) {
  if (!text) return;
  const list = state.lists.find(l => l.id === state.selectedListId);
  if (!list) return;
  list.items.push({ id: uid(), text, done: false });
  save();
  renderChecklist();
}

function toggleChecklistItem(id) {
  const list = state.lists.find(l => l.id === state.selectedListId);
  if (!list) return;
  const item = list.items.find(i => i.id === id);
  if (item) item.done = !item.done;
  save();
  renderChecklist();
}

/* ===== SETTINGS ===== */
function renderSettings() {
  document.getElementById('screen-settings').innerHTML = `
    <div class="page-header"><div class="page-title">Settings</div></div>
    <div class="page-divider"></div>
    <div class="page-body">
      <div class="settings-group">
        <button type="button" class="settings-item" id="btn-export">データをエクスポート <span>›</span></button>
        <button type="button" class="settings-item" id="btn-import">データをインポート <span>›</span></button>
      </div>
      <div class="settings-group">
        <button type="button" class="settings-item danger" id="btn-clear">全データ削除 <span>›</span></button>
      </div>
    </div>`;
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', importData);
  document.getElementById('btn-clear').addEventListener('click', clearAllData);
}

function exportData() {
  const { modal, ...data } = state;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mofu-todo-' + todayStr() + '.json';
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        Object.assign(state, data);
        migrate();
        save();
        alert('インポートしました');
        render();
      } catch { alert('読み込みに失敗しました'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAllData() {
  openConfirmModal('全てのデータを削除しますか？', () => {
    state.tasks = [];
    state.deletedTasks = [];
    state.lists = [{ id: uid(), name:'買い出しリスト', emoji:'🛒', items:[] }];
    state.selectedListId = state.lists[0].id;
    state.routines = [];
    state.routineDraft = {};
    state.events = [];
    save();
    alert('削除しました');
    render();
  });
}

/* ===== MODAL ===== */
function openModal(html) {
  document.getElementById('modal-content').innerHTML = '<div class="modal-handle"></div>' + html;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-overlay').onclick = e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  };
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function openConfirmModal(msg, onYes) {
  openModal(`
    <h3>確認</h3>
    <p style="margin-bottom:20px;font-size:15px;line-height:1.5">${esc(msg)}</p>
    <div class="modal-btns">
      <button type="button" class="modal-btn secondary" id="modal-no">キャンセル</button>
      <button type="button" class="modal-btn danger" id="modal-yes">削除する</button>
    </div>`);
  document.getElementById('modal-no').onclick = closeModal;
  document.getElementById('modal-yes').onclick = () => { closeModal(); onYes(); };
}

function openEventModal(type) {
  const preset = EVENT_TYPES.find(t => t.type === type);
  openModal(`
    <h3>イベント追加</h3>
    <div class="modal-field"><label>タイトル</label><input type="text" id="m-ev-title" placeholder="${esc(preset.label)}"></div>
    <div class="modal-field"><label>日付</label><input type="date" id="m-ev-date" value="${state.eventYear}-06-01"></div>
    <div class="modal-btns">
      <button type="button" class="modal-btn secondary" id="modal-cancel">キャンセル</button>
      <button type="button" class="modal-btn primary" id="modal-save-ev">追加</button>
    </div>`);
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save-ev').onclick = () => {
    const title = document.getElementById('m-ev-title').value.trim() || preset.label;
    const date = document.getElementById('m-ev-date').value;
    if (!date) return;
    state.events.push({ id: uid(), title, date, icon: preset.icon, eventType: type });
    save();
    closeModal();
    renderEvent();
  };
}

function openListPickerModal() {
  openModal(`
    <h3>リストを選択</h3>
    ${state.lists.map(l => `
      <button type="button" class="settings-item" style="width:100%;margin-bottom:8px;border-radius:12px;border:1px solid #f0f0f0" data-list-id="${esc(l.id)}">
        ${esc(l.emoji)} ${esc(l.name)} ${l.id===state.selectedListId?'✓':''}
      </button>`).join('')}
    <button type="button" class="modal-btn primary" style="width:100%;margin-top:12px" id="btn-new-list">新しいリスト</button>`);
  document.querySelectorAll('[data-list-id]').forEach(btn => {
    btn.onclick = () => { state.selectedListId = btn.dataset.listId; save(); closeModal(); renderChecklist(); };
  });
  document.getElementById('btn-new-list').onclick = () => {
    closeModal();
    openListEditModal(null);
  };
}

function openListEditModal(id) {
  const list = id ? state.lists.find(l => l.id === id) : null;
  openModal(`
    <h3>${list ? 'リスト編集' : '新しいリスト'}</h3>
    <div class="modal-field"><label>名前</label><input type="text" id="m-list-name" value="${list ? esc(list.name) : ''}" placeholder="買い出しリスト"></div>
    <div class="modal-field"><label>絵文字</label><input type="text" id="m-list-emoji" value="${list ? esc(list.emoji) : '🛒'}" maxlength="4"></div>
    <div class="modal-btns">
      <button type="button" class="modal-btn secondary" id="modal-cancel">キャンセル</button>
      <button type="button" class="modal-btn primary" id="modal-save-list">保存</button>
    </div>
    ${list ? '<button type="button" class="modal-btn danger" style="width:100%;margin-top:8px" id="modal-del-list">リスト削除</button>' : ''}`);
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save-list').onclick = () => {
    const name = document.getElementById('m-list-name').value.trim();
    const emoji = document.getElementById('m-list-emoji').value.trim() || '📋';
    if (!name) return;
    if (list) { list.name = name; list.emoji = emoji; }
    else {
      const nl = { id: uid(), name, emoji, items:[] };
      state.lists.push(nl);
      state.selectedListId = nl.id;
    }
    save();
    closeModal();
    renderChecklist();
  };
  if (list) {
    document.getElementById('modal-del-list').onclick = () => {
      if (state.lists.length <= 1) { alert('最後のリストは削除できません'); return; }
      openConfirmModal('このリストを削除しますか？', () => {
        state.lists = state.lists.filter(l => l.id !== id);
        state.selectedListId = state.lists[0].id;
        save();
        closeModal();
        renderChecklist();
      });
    };
  }
}

function openRestoreModal() {
  openModal(`
    <h3>削除されたタスク</h3>
    ${state.deletedTasks.map(t => `
      <button type="button" class="settings-item" style="width:100%;margin-bottom:8px;border-radius:12px;border:1px solid #f0f0f0" data-restore="${esc(t.id)}">
        ${esc(t.text)} <span>${t.date || ''}</span>
      </button>`).join('')}
    <button type="button" class="modal-btn secondary" style="width:100%;margin-top:12px" id="modal-close">閉じる</button>`);
  document.querySelectorAll('[data-restore]').forEach(btn => {
    btn.onclick = () => {
      const idx = state.deletedTasks.findIndex(t => t.id === btn.dataset.restore);
      if (idx >= 0) {
        const t = state.deletedTasks.splice(idx, 1)[0];
        delete t.deletedAt;
        state.tasks.push(t);
        save();
      }
      closeModal();
      renderTodo();
    };
  });
  document.getElementById('modal-close').onclick = closeModal;
}

function openFabModal() {
  if (state.screen === 'todo') {
    document.getElementById('todo-input')?.focus();
    return;
  }
  if (state.screen === 'checklist') {
    document.getElementById('cl-input')?.focus();
    return;
  }
  if (state.screen === 'event') {
    openEventModal('birthday');
    return;
  }
  if (state.screen === 'routine') {
    openModal(`
      <h3>ルーティン追加</h3>
      <div class="modal-field"><label>内容</label><input type="text" id="m-routine-text" placeholder="毎朝の習慣"></div>
      <div class="modal-btns">
        <button type="button" class="modal-btn secondary" id="modal-cancel">キャンセル</button>
        <button type="button" class="modal-btn primary" id="modal-save-r">追加</button>
      </div>`);
    document.getElementById('modal-cancel').onclick = closeModal;
    document.getElementById('modal-save-r').onclick = () => {
      const text = document.getElementById('m-routine-text').value.trim();
      if (!text) return;
      state.routines.push({ id: uid(), text, icon: '✨' });
      save();
      closeModal();
      renderRoutine();
    };
  }
}

document.getElementById('fab').addEventListener('click', openFabModal);

/* ===== INIT ===== */
load();
state.selectedDate = todayStr();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
